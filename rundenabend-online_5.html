<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rundenabend — Online</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;500;600;700;800&display=swap">
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.5/dist/peerjs.min.js"></script>
<style>
  :root{
    --bg:#FCF8FF; --surface:#FFFFFF; --surface-tint:#F4EEFF;
    --ink:#2B2140; --ink-dim:#6E6285; --ink-faint:#A79BC0;
    --line: rgba(43,33,64,0.10); --line-strong: rgba(43,33,64,0.20);
    --coral:#FF5D7A; --coral-deep:#E8375A; --sun:#FFC23C; --sky:#2FBEEA; --grass:#29C48A; --grape:#9B6BFF;
    --cat-icebreaker: var(--sun); --cat-funny: var(--coral); --cat-deep: var(--grape); --cat-pflicht: var(--sky);
    --shadow: 0 18px 40px rgba(43,33,64,0.14);
    --font-display:'Baloo 2','Segoe UI Rounded','Nunito',sans-serif;
    --font-body:'Nunito',-apple-system,'Segoe UI',sans-serif;
  }
  *{ box-sizing:border-box; }
  html{ color-scheme: light; }
  body{
    margin:0; min-height:100vh; background:
      radial-gradient(55% 40% at 15% 0%, rgba(255,194,60,0.14), transparent 60%),
      radial-gradient(55% 45% at 100% 10%, rgba(47,190,234,0.12), transparent 60%),
      radial-gradient(60% 50% at 50% 115%, rgba(255,93,122,0.10), transparent 60%),
      var(--bg);
    color: var(--ink); font-family: var(--font-body); -webkit-font-smoothing:antialiased;
  }
  #app{ max-width:520px; margin:0 auto; padding:26px 18px 60px; min-height:100vh; position:relative; }
  h1,h2,h3{ font-family: var(--font-display); text-wrap: balance; margin:0; }
  button{ font-family:inherit; }
  button:focus-visible, input:focus-visible{ outline:3px solid var(--sky); outline-offset:2px; }
  @media (prefers-reduced-motion: reduce){ *{ animation-duration:.01ms !important; transition-duration:.01ms !important; } }

  .home-head{ padding:8px 4px 28px; }
  .eyebrow{ font-family:var(--font-body); font-weight:800; font-size:12px; letter-spacing:.13em; text-transform:uppercase; color:var(--coral); margin:0 0 8px; }
  .home-head h1{ font-size:42px; font-weight:800; color:var(--ink); }
  .tagline{ color:var(--ink-dim); font-size:15px; line-height:1.5; margin:10px 0 0; max-width:38ch; }
  .shelf{ display:flex; flex-direction:column; gap:14px; }
  .game-tile{
    position:relative; overflow:hidden; display:flex; align-items:center; gap:16px;
    padding:18px 20px 18px 22px; background:var(--surface); border:2px solid var(--line);
    border-radius:20px; cursor:pointer; text-align:left; width:100%; color:inherit;
    box-shadow: var(--shadow); transition: transform .16s ease, border-color .16s ease;
  }
  .game-tile::before{ content:''; position:absolute; left:0; top:0; bottom:0; width:6px; background:var(--accent,var(--ink-faint)); }
  .game-tile:hover{ transform: translateY(-3px) rotate(-0.3deg); border-color: var(--accent, var(--line-strong)); }
  .game-tile.locked{ cursor:default; opacity:.55; box-shadow:none; }
  .game-tile.locked:hover{ transform:none; }
  .tile-icon{ flex:0 0 auto; width:48px; height:48px; display:flex; align-items:center; justify-content:center; }
  .tile-body{ flex:1 1 auto; min-width:0; }
  .tile-body h3{ font-size:20px; font-weight:700; }
  .tile-body p{ margin:4px 0 0; font-size:13.5px; color:var(--ink-dim); line-height:1.4; }
  .tile-tag{ flex:0 0 auto; font-size:11px; font-weight:800; letter-spacing:.05em; text-transform:uppercase; padding:6px 11px; border-radius:999px; white-space:nowrap; }
  .tile-tag.ready{ background: rgba(255,93,122,0.14); color: var(--coral-deep); }
  .tile-tag.soon{ background: var(--surface-tint); color: var(--ink-faint); }

  .screen-head{ display:flex; align-items:center; gap:14px; padding:2px 2px 20px; }
  .icon-btn{ flex:0 0 auto; width:40px; height:40px; border-radius:999px; background:var(--surface); border:2px solid var(--line); color:var(--ink); display:flex; align-items:center; justify-content:center; cursor:pointer; transition: border-color .15s ease, transform .1s ease; }
  .icon-btn:hover{ border-color: var(--line-strong); transform: translateY(-1px); }
  .screen-head h2{ font-size:24px; font-weight:700; }

  .card{ background:var(--surface); border:2px solid var(--line); border-radius:22px; padding:20px; margin-bottom:14px; box-shadow: var(--shadow); }
  .card h3{ font-size:13px; font-weight:800; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-dim); margin-bottom:14px; }

  .chip-input{ display:flex; gap:8px; }
  .chip-input input{ flex:1 1 auto; min-width:0; background:var(--surface-tint); border:2px solid var(--line); color:var(--ink); border-radius:13px; padding:11px 14px; font-size:15px; font-weight:600; }
  .chip-input input::placeholder{ color:var(--ink-faint); font-weight:500; }
  .btn-accent-sm{ flex:0 0 auto; background:var(--coral); color:#fff; border:none; border-radius:13px; padding:0 16px; font-weight:800; font-size:14px; cursor:pointer; transition: background .15s ease, transform .1s ease; }
  .btn-accent-sm:hover{ background:var(--coral-deep); transform: translateY(-1px); }
  .hint{ font-size:13px; color:var(--ink-faint); margin:12px 0 0; font-weight:600; }
  .hint.warn{ color:var(--coral-deep); }

  .segmented{ display:flex; gap:8px; flex-wrap:wrap; }
  .segmented button{ flex:1 1 auto; background:var(--surface-tint); border:2px solid var(--line); color:var(--ink-dim); border-radius:13px; padding:10px 8px; font-size:14px; font-weight:700; cursor:pointer; transition: all .15s ease; }
  .segmented button.active{ background: rgba(255,93,122,0.12); border-color:var(--coral); color:var(--coral-deep); }
  .num-inline{ margin-top:12px; width:100%; background:var(--surface-tint); border:2px solid var(--line); color:var(--ink); border-radius:13px; padding:11px 14px; font-size:15px; font-weight:700; }

  .radio-group{ display:flex; flex-direction:column; gap:12px; }
  .radio-group label{ display:flex; align-items:center; gap:10px; font-size:14.5px; font-weight:600; color:var(--ink-dim); cursor:pointer; }
  .radio-group label:has(input:checked){ color:var(--ink); }
  .radio-group input[type=radio]{ accent-color:var(--coral); width:17px; height:17px; flex:0 0 auto; }
  .radio-group input[type=number]{ width:64px; background:var(--surface-tint); border:2px solid var(--line); color:var(--ink); border-radius:9px; padding:5px 8px; font-size:14px; font-weight:700; }
  #everyone-rounds{ color:var(--coral-deep); font-weight:800; }

  .btn-primary{ background: linear-gradient(135deg, var(--coral), var(--coral-deep)); color:#fff; border:none; border-radius:16px; font-weight:800; font-size:16px; padding:16px; cursor:pointer; box-shadow: 0 10px 22px rgba(232,55,90,0.3); transition: transform .12s ease, box-shadow .12s ease, opacity .15s ease; }
  .btn-primary:hover:not(:disabled){ transform: translateY(-2px); box-shadow: 0 14px 26px rgba(232,55,90,0.36); }
  .btn-primary:active:not(:disabled){ transform: scale(0.98); }
  .btn-primary:disabled{ opacity:.4; cursor:not-allowed; box-shadow:none; }
  .btn-ghost{ background:var(--surface); color:var(--ink-dim); border:2px solid var(--line); border-radius:16px; font-weight:700; font-size:15px; padding:14px; cursor:pointer; }
  .btn-ghost:hover{ border-color: var(--line-strong); color:var(--ink); }
  .btn-block{ width:100%; }
  .btn-row{ display:flex; gap:10px; }
  .btn-row > *{ flex:1 1 0; }

  .avatar-stage{ display:flex; flex-direction:column; align-items:center; padding:6px 0 6px; }
  .avatar-big{ width:168px; height:168px; border-radius:26px; background: var(--surface-tint); display:flex; align-items:flex-start; justify-content:center; overflow:hidden; box-shadow: inset 0 0 0 2px var(--line); }
  .avatar-name{ font-family:var(--font-display); font-size:24px; font-weight:700; margin-top:14px; }
  .trait-row{ margin-bottom:16px; }
  .trait-label{ font-size:12px; font-weight:800; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-dim); margin-bottom:9px; }
  .swatches{ display:flex; gap:9px; flex-wrap:wrap; }
  .swatch{ width:32px; height:32px; border-radius:999px; border:3px solid transparent; cursor:pointer; padding:0; box-shadow: 0 2px 6px rgba(43,33,64,0.18); transition: transform .12s ease; }
  .swatch:hover{ transform: scale(1.08); }
  .swatch.selected{ border-color:var(--ink); transform: scale(1.1); }
  .slider-row input[type=range]{ width:100%; accent-color:var(--coral); height:22px; }
  .slider-labels{ display:flex; justify-content:space-between; font-size:12px; color:var(--ink-faint); font-weight:700; margin-top:2px; }
  .btn-text{ background:none; border:none; color:var(--ink-dim); font-weight:700; font-size:13.5px; cursor:pointer; text-decoration:underline; text-underline-offset:3px; padding:6px; }
  .btn-text:hover{ color:var(--coral-deep); }

  .round-badge{ font-weight:800; font-size:13px; color:var(--ink-dim); background:var(--surface); border:2px solid var(--line); border-radius:999px; padding:8px 14px; }
  .round-badge span{ color:var(--coral-deep); font-variant-numeric: tabular-nums; }

  .reveal-title{ text-align:center; font-size:18px; font-weight:800; color:var(--ink-dim); margin:6px 0 18px; }
  .reveal-cloud{ display:flex; flex-wrap:wrap; gap:16px; justify-content:center; padding:10px 4px 20px; }
  .reveal-chip{ display:flex; flex-direction:column; align-items:center; gap:7px; animation: pop-in .5s cubic-bezier(.34,1.56,.64,1) backwards; }
  .reveal-chip .av{ width:64px; height:64px; border-radius:999px; overflow:hidden; background:var(--surface); box-shadow: var(--shadow); }
  .reveal-chip span{ font-size:12.5px; font-weight:800; max-width:78px; text-align:center; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  .pair-reveal-grid, .pair-grid{ display:grid; grid-template-columns: repeat(auto-fit,minmax(230px,1fr)); gap:14px; margin-bottom:8px; }
  .pair-reveal-card, .pair-card{ background:var(--surface); border:2px solid var(--line); border-radius:22px; padding:18px 16px; box-shadow: var(--shadow); position:relative; }
  .pair-reveal-card{ display:flex; align-items:center; justify-content:center; gap:10px; overflow:visible; min-height:118px; }
  .pair-reveal-card .av{ width:58px; height:58px; border-radius:999px; overflow:hidden; background:var(--surface-tint); box-shadow: 0 0 0 3px #fff, var(--shadow); }
  .pair-reveal-card .side-a{ animation: clink-a .6s ease .35s both; }
  .pair-reveal-card .side-b{ animation: clink-b .6s ease .35s both; }
  .pair-plus{ font-family:var(--font-display); font-size:22px; color:var(--ink-faint); }
  .pair-sparkle{ position:absolute; top:50%; left:50%; margin-top:-16px; margin-left:-16px; animation: sparkle-pop .8s ease .6s both; pointer-events:none; }

  .pair-card{ transition: outline .2s ease; }
  .pair-card.you-pair{ outline:3px solid var(--coral); outline-offset:2px; }
  .pair-card .pair-heads{ display:flex; align-items:center; justify-content:center; gap:10px; margin-bottom:10px; }
  .pair-card .av{ width:46px; height:46px; border-radius:999px; overflow:hidden; background:var(--surface-tint); box-shadow: 0 0 0 3px #fff, 0 2px 8px rgba(43,33,64,0.15); }
  .pair-card .pair-names{ font-family:var(--font-display); font-weight:700; font-size:16px; text-align:center; margin-bottom:10px; }
  .pair-card .pair-question{ font-size:15px; line-height:1.4; font-weight:600; text-align:center; color:var(--ink); min-height:44px; }
  .pair-card .cat-dot{ display:inline-block; width:8px; height:8px; border-radius:999px; margin-right:6px; vertical-align:middle; }
  .pair-reroll{ display:flex; justify-content:center; margin-top:10px; }
  .pair-reroll button{ background:var(--surface-tint); border:none; color:var(--ink-dim); border-radius:999px; padding:6px 11px; font-size:12px; font-weight:700; cursor:pointer; display:inline-flex; align-items:center; gap:5px; }
  .pair-reroll button:hover{ color:var(--coral-deep); background: rgba(255,93,122,0.12); }

  .timer-strip{ display:flex; align-items:center; gap:16px; background:var(--surface); border:2px solid var(--line); border-radius:22px; padding:14px 18px; margin:16px 0; box-shadow: var(--shadow); }
  .timer-ring-box{ position:relative; width:64px; height:64px; flex:0 0 auto; }
  .timer-ring{ width:64px; height:64px; transform: rotate(-90deg); }
  .ring-bg{ fill:none; stroke: var(--surface-tint); stroke-width:7; }
  .ring-progress{ fill:none; stroke:var(--coral); stroke-width:7; stroke-linecap:round; transition: stroke-dashoffset .3s linear, stroke .3s ease; }
  .ring-progress.done{ stroke: var(--grass); }
  .timer-label{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-family:var(--font-display); font-size:15px; font-weight:700; font-variant-numeric: tabular-nums; }
  .timer-mid{ flex:1 1 auto; }
  .timer-mid p{ margin:0; font-size:12px; font-weight:800; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-faint); }
  .timer-controls{ display:flex; gap:8px; }
  #timer-toggle-btn{ display:flex; align-items:center; gap:6px; background:var(--coral); color:#fff; border:none; border-radius:999px; padding:0 16px; height:42px; font-weight:800; font-size:13.5px; cursor:pointer; }
  #timer-toggle-btn:hover{ background:var(--coral-deep); }
  .timer-controls .icon-btn{ width:42px; height:42px; }
  .round-actions{ margin-bottom:18px; }

  .choice-grid{ display:flex; flex-direction:column; gap:14px; }
  .choice-card{
    display:flex; align-items:center; gap:16px; text-align:left; width:100%;
    background:var(--surface); border:2px solid var(--line); border-radius:22px; padding:20px;
    cursor:pointer; box-shadow: var(--shadow); transition: transform .15s ease, border-color .15s ease;
  }
  .choice-card:hover{ transform: translateY(-3px); border-color: var(--coral); }
  .choice-icon{ flex:0 0 auto; width:52px; height:52px; border-radius:16px; background:var(--surface-tint); display:flex; align-items:center; justify-content:center; }
  .choice-card h3{ font-size:18px; font-weight:700; margin-bottom:4px; }
  .choice-card p{ margin:0; font-size:13.5px; color:var(--ink-dim); line-height:1.4; }

  .king-card{
    background: linear-gradient(160deg, #FFF6DE, #FFEAB0);
    border:2px solid var(--sun); border-radius:22px; padding:18px 16px; text-align:center;
    margin-bottom:14px; box-shadow: var(--shadow); position:relative; overflow:visible;
  }
  .king-crown{ font-size:34px; display:inline-block; animation: crown-drop .6s cubic-bezier(.34,1.56,.64,1) both; }
  .king-title{ font-family:var(--font-display); font-weight:700; font-size:17px; color:#8A6300; margin:4px 0 2px; }
  .king-name{ font-family:var(--font-display); font-weight:700; font-size:20px; color:var(--ink); margin-bottom:8px; }
  .king-task{ font-size:14px; font-weight:600; color:var(--ink); background:rgba(255,255,255,0.6); border-radius:13px; padding:10px 14px; line-height:1.4; }
  .king-sparkle{ position:absolute; top:-6px; left:50%; margin-left:-16px; animation: sparkle-pop .8s ease .5s both; pointer-events:none; }
  @keyframes crown-drop{ 0%{ transform: translateY(-28px) rotate(-15deg) scale(0.5); opacity:0; } 60%{ transform: translateY(4px) rotate(8deg) scale(1.15); opacity:1; } 100%{ transform: translateY(0) rotate(0) scale(1); opacity:1; } }

  .round-overlay{ position:fixed; inset:0; background: rgba(43,33,64,0.68); backdrop-filter: blur(2px); display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:60; }
  .overlay-number{ font-family:var(--font-display); font-weight:800; font-size:128px; color:#fff; line-height:1; text-shadow:0 10px 26px rgba(0,0,0,0.35); animation: count-pop .55s cubic-bezier(.34,1.56,.64,1); }
  .overlay-number.go{ font-size:58px; color:var(--sun); }
  .overlay-sub{ margin-top:10px; color:rgba(255,255,255,0.85); font-weight:700; font-size:14px; letter-spacing:.04em; text-transform:uppercase; }
  .overlay-flash{ background: linear-gradient(135deg, rgba(255,93,122,0.94), rgba(155,107,255,0.9)); }
  .overlay-flash .overlay-number{ font-size:52px; }
  .confetti-piece{ position:absolute; top:-14px; width:9px; height:15px; border-radius:2px; animation-name: confetti-fall; animation-timing-function: ease-in; animation-fill-mode: forwards; }

  .round-group{ margin-bottom:16px; }
  .round-group-head{ display:flex; align-items:center; gap:10px; margin-bottom:8px; }
  .round-group-head h4{ font-family:var(--font-display); font-size:15px; font-weight:700; margin:0; }
  .bye-note{ font-size:12.5px; font-weight:700; color:var(--ink-faint); background:var(--surface-tint); border-radius:999px; padding:6px 12px; margin-left:auto; }
  .recap-pair-row{ display:flex; align-items:center; gap:10px; background:var(--surface-tint); border-radius:14px; padding:9px 12px; margin-bottom:7px; font-size:13.5px; font-weight:700; }
  .recap-pair-row .av{ width:26px; height:26px; border-radius:999px; overflow:hidden; flex:0 0 auto; background:#fff; }
  .recap-pair-row .names{ flex:1 1 auto; }
  .result-actions{ display:flex; flex-direction:column; gap:10px; margin-top:6px; }

  /* ---------- online: lobby / connection ---------- */
  .lobby-code-box{ text-align:center; }
  .lobby-code{ font-family:var(--font-display); font-size:42px; font-weight:800; letter-spacing:.14em; color:var(--coral-deep); margin:4px 0 12px; }
  .lobby-link-row{ display:flex; gap:8px; margin-bottom:4px; }
  .lobby-link-row input{ flex:1 1 auto; min-width:0; background:var(--surface-tint); border:2px solid var(--line); border-radius:12px; padding:10px 12px; font-size:12.5px; color:var(--ink-dim); font-weight:600; }
  .status-banner{ display:flex; align-items:center; gap:10px; background:var(--surface-tint); border:2px solid var(--line); border-radius:16px; padding:12px 16px; margin-bottom:14px; font-size:14px; font-weight:700; color:var(--ink-dim); }
  .status-banner.warn{ background: rgba(255,194,60,0.16); border-color:var(--sun); color:#8A6300; }
  .status-banner.error{ background: rgba(226,55,90,0.1); border-color:var(--coral); color:var(--coral-deep); }
  .status-dot{ width:10px; height:10px; border-radius:999px; background:var(--grass); flex:0 0 auto; }
  .status-dot.pulse{ animation: dot-pulse 1s ease-in-out infinite; background:var(--sun); }
  @keyframes dot-pulse{ 0%,100%{opacity:1;} 50%{opacity:.3;} }
  .lobby-roster{ display:flex; flex-wrap:wrap; gap:10px; margin-top:6px; }
  .lobby-player{ display:flex; align-items:center; gap:8px; background:var(--surface-tint); border:2px solid var(--line); border-radius:999px; padding:6px 12px 6px 6px; font-size:13.5px; font-weight:700; }
  .lobby-player .av{ width:30px; height:30px; border-radius:999px; overflow:hidden; background:#fff; flex:0 0 auto; }
  .lobby-player.offline{ opacity:.5; }
  .you-badge{ font-size:10.5px; font-weight:800; color:var(--coral-deep); background:rgba(255,93,122,0.14); border-radius:999px; padding:2px 7px; margin-left:2px; }
  .host-badge{ font-size:10.5px; font-weight:800; color:#8A6300; background:rgba(255,194,60,0.2); border-radius:999px; padding:2px 7px; margin-left:2px; }
  .spectator-note{ text-align:center; font-size:13.5px; color:var(--ink-faint); font-weight:600; margin:10px 0; }
  .code-entry{ display:flex; gap:8px; }
  .code-entry input{ flex:1 1 auto; text-align:center; letter-spacing:.18em; text-transform:uppercase; font-family:var(--font-display); font-size:20px; font-weight:700; background:var(--surface-tint); border:2px solid var(--line); color:var(--ink); border-radius:13px; padding:11px 8px; }

  @keyframes pop-in{ 0%{ transform: scale(0.35) translateY(10px); opacity:0; } 65%{ transform: scale(1.08) translateY(-2px); opacity:1; } 100%{ transform: scale(1) translateY(0); opacity:1; } }
  @keyframes clink-a{ 0%,100%{ transform: translateX(0) rotate(0); } 45%,55%{ transform: translateX(9px) rotate(-6deg); } }
  @keyframes clink-b{ 0%,100%{ transform: translateX(0) rotate(0); } 45%,55%{ transform: translateX(-9px) rotate(6deg); } }
  @keyframes sparkle-pop{ 0%{ transform: scale(0) rotate(0deg); opacity:0; } 45%{ transform: scale(1.25) rotate(18deg); opacity:1; } 100%{ transform: scale(0.7) rotate(35deg); opacity:0; } }
  @keyframes count-pop{ 0%{ transform: scale(0.25); opacity:0; } 55%{ transform: scale(1.2); opacity:1; } 100%{ transform: scale(1); opacity:1; } }
  @keyframes confetti-fall{ 0%{ transform: translateY(-10px) rotate(0deg); opacity:1; } 100%{ transform: translateY(150px) rotate(380deg); opacity:0; } }
</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
  "use strict";

  /* =====================================================================
     RUNDENABEND — Online-Version (PeerJS, keine eigene Server-Datenbank)
     ===================================================================== */
  const app = document.getElementById('app');

  function escapeHtml(str){
    return String(str).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
  }
  function shuffle(arr){
    const a = arr.slice();
    for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
    return a;
  }
  function pairKey(a,b){ return [a,b].sort().join('␟'); }
  function loadJSON(key, fallback){ try{ const raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : fallback; }catch(e){ return fallback; } }
  function saveJSON(key, value){ try{ localStorage.setItem(key, JSON.stringify(value)); }catch(e){} }

  const SFX = (function(){
    let ctx = null;
    function ensureCtx(){
      const C = window.AudioContext || window.webkitAudioContext;
      if(!C) return null;
      if(!ctx) ctx = new C();
      if(ctx.state === 'suspended') ctx.resume().catch(()=>{});
      return ctx;
    }
    function tone(freq, start, dur, type, peak){
      const c = ensureCtx(); if(!c) return;
      const osc = c.createOscillator(), gain = c.createGain();
      osc.type = type || 'sine'; osc.frequency.value = freq;
      const t0 = c.currentTime + Math.max(0, start||0);
      gain.gain.setValueAtTime(0, t0);
      gain.gain.linearRampToValueAtTime(peak||0.14, t0+0.02);
      gain.gain.exponentialRampToValueAtTime(0.001, t0+dur);
      osc.connect(gain).connect(c.destination);
      osc.start(t0); osc.stop(t0+dur+0.05);
    }
    return {
      unlock(){ ensureCtx(); },
      pop(i){ tone(420 + (i%8)*38, 0, 0.16, 'triangle', 0.08); },
      clink(){ tone(1046.5, 0, 0.35, 'sine', 0.11); tone(1568, 0.04, 0.4, 'sine', 0.09); },
      tick(n){ tone(n===3?415:n===2?523:659, 0, 0.13, 'square', 0.06); },
      go(){ tone(523,0,0.12,'triangle',0.13); tone(659,0.09,0.12,'triangle',0.13); tone(880,0.18,0.24,'triangle',0.15); },
      timeUp(){ tone(659,0,0.16,'sine',0.12); tone(880,0.1,0.16,'sine',0.12); tone(1046.5,0.2,0.55,'sine',0.13); },
      king(){ tone(392,0,0.14,'triangle',0.11); tone(587,0.1,0.14,'triangle',0.11); tone(784,0.2,0.38,'triangle',0.14); }
    };
  })();

  /* ---------- Runden-Planung (Round-Robin, Zirkelmethode) ---------- */
  function buildSchedule(players){
    let list = players.slice();
    if(list.length % 2 !== 0) list.push({ id:'__bye__', name:'Pause' });
    const n = list.length, rounds = n-1;
    const fixed = list[0];
    let rotating = list.slice(1);
    const schedule = [];
    for(let r=0;r<rounds;r++){
      const arr = [fixed, ...rotating];
      const pairs = []; let byeId = null;
      for(let k=0;k<n/2;k++){
        const a = arr[k], b = arr[n-1-k];
        if(a.id==='__bye__') byeId=b.id; else if(b.id==='__bye__') byeId=a.id; else pairs.push([a,b]);
      }
      schedule.push({ pairs, byeId });
      rotating.unshift(rotating.pop());
    }
    return schedule;
  }
  function extraRound(players, usedPairs, byeCounts){
    let list = players.slice();
    let byeId = null;
    if(list.length % 2 !== 0){
      const minBye = Math.min(...list.map(p => byeCounts[p.id]||0));
      const candidates = list.filter(p => (byeCounts[p.id]||0) === minBye);
      const chosen = candidates[Math.floor(Math.random()*candidates.length)];
      byeId = chosen.id;
      list = list.filter(p => p.id !== chosen.id);
    }
    let best = null, bestConflicts = Infinity;
    for(let attempt=0; attempt<150; attempt++){
      const sh = shuffle(list);
      const pairs = [];
      let conflicts = 0;
      for(let k=0;k<sh.length;k+=2){
        pairs.push([sh[k], sh[k+1]]);
        if(usedPairs.has(pairKey(sh[k].id, sh[k+1].id))) conflicts++;
      }
      if(conflicts < bestConflicts){ best = pairs; bestConflicts = conflicts; if(conflicts===0) break; }
    }
    return { pairs: best, byeId };
  }

  function teardownConnection(){
    clearRoundTimeouts();
    try{
      if(role==='host'){
        Object.values(H.conns).forEach(c=>{ try{ c.send({type:'closed'}); }catch(e){} try{ c.close(); }catch(e){} });
      } else if(hostConn){ try{ hostConn.close(); }catch(e){} }

    }catch(e){}

  /* ---------- Host: Raum eröffnen ---------- */
  function hostBegin(name, avatar){
    UI.draftName = name; UI.draftAvatar = avatar; myName=name; myAvatar=avatar;
    if(typeof Peer==='undefined'){
      UI.error='Die Verbindungsbibliothek konnte nicht geladen werden. Prüfe deine Internetverbindung und lade die Seite neu.';
      UI.view='error'; render(); return;
    }
    const code = generateRoomCode();
    gs = freshGameState(code, myId);
    gs.players.push({ id: myId, name, avatar, online:true });
    UI.roomSettings = { roundSeconds:240, mode:'everyone', roundsCount:5 };
    role='host'; UI.view='connecting'; UI.error=null; render();
    if(peer){ try{ peer.destroy(); }catch(e){} }
    try{
      peer = new Peer('rundenabend-'+code, { debug:0 });
    }catch(e){ UI.error='Der Raum konnte nicht erstellt werden.'; UI.view='error'; render(); return; }
    peer.on('open', ()=>{ render(); });
    peer.on('connection', (conn)=>{
      conn.on('data', (msg)=>handleHostData(conn,msg));
      conn.on('close', ()=>markOffline(conn));
      conn.on('error', ()=>markOffline(conn));
    });
    peer.on('error', (err)=>{
      if(err && err.type==='unavailable-id'){ peer.destroy(); hostBegin(name, avatar); return; }
      UI.error = 'Der Raum konnte nicht erstellt werden ('+(err&&err.type||'Fehler')+'). Prüfe deine Internetverbindung und versuch es erneut.';
      UI.view='error'; role=null; render();
    });
  }
  function handleHostData(conn, msg){
    if(!msg || msg.type!=='join' || !gs) return;
    let p = gs.players.find(p=>p.id===msg.id);
    if(p){ p.name=msg.name; p.avatar=msg.avatar; p.online=true; }
    else { gs.players.push({ id:msg.id, name:msg.name, avatar:msg.avatar, online:true }); }
    H.conns[msg.id] = conn;
    broadcastState();
  }
  function markOffline(conn){
    if(!gs) return;
    const id = Object.keys(H.conns).find(k=>H.conns[k]===conn);
    if(id){ const p = gs.players.find(p=>p.id===id); if(p) p.online=false; delete H.conns[id]; broadcastState(); }
  }
  function broadcastState(){
    Object.keys(H.conns).forEach(id=>{
      const c = H.conns[id];
      if(c && c.open){ try{ c.send({ type:'state', gs }); }catch(e){} }
    });
    render();
  }

  function hostStartGame(){
    H.playersFrozen = gs.players.map(p=>({ id:p.id, name:p.name, avatar:p.avatar }));
    if(gs.settings.mode==='everyone'){
      H.schedule = buildSchedule(H.playersFrozen);
      gs.totalRounds = H.schedule.length;
    } else {
      H.usedPairsSet = new Set(); H.byeCounts = {};
      gs.totalRounds = gs.settings.roundsCount;
    }
    gs.round = 0; gs.history = []; gs.started = true;
    hostNextRound();
  }
  function hostNextRound(){
    gs.round += 1;
    if(gs.round > gs.totalRounds){ hostShowResults(); return; }
    let pairsRaw, byeId;
    if(gs.settings.mode==='everyone'){
      const entry = H.schedule[gs.round-1];
      pairsRaw = entry.pairs; byeId = entry.byeId;
    } else {
      const entry = extraRound(H.playersFrozen, H.usedPairsSet, H.byeCounts);
      pairsRaw = entry.pairs; byeId = entry.byeId;
      pairsRaw.forEach(([a,b])=>H.usedPairsSet.add(pairKey(a.id,b.id)));
      if(byeId) H.byeCounts[byeId] = (H.byeCounts[byeId]||0)+1;
    }
    const pairs = pairsRaw.map(([a,b])=>{ const q = hostPickQuestion(); return { a, b, cat:q.cat, text:q.text }; });
    gs.pairs = pairs;
    gs.byeId = byeId || null;
    gs.kingTask = gs.byeId ? hostPickKingTask() : null;
    const byeName = gs.byeId ? ((H.playersFrozen.find(p=>p.id===gs.byeId)||{}).name || null) : null;
    gs.history.push({ round: gs.round, byeName, pairs: pairs.map(p=>({ aName:p.a.name, bName:p.b.name })) });
    hostBeginRoundSequence();
  }
  function hostBeginRoundSequence(){
    clearRoundTimeouts();
    gs.phase='reveal1'; gs.countdownN=null;
    broadcastState();
    H.seqTimeouts.push(setTimeout(()=>{ gs.phase='reveal2'; broadcastState(); }, 1500));
    H.seqTimeouts.push(setTimeout(()=>{ gs.phase='countdown'; gs.countdownN=3; broadcastState(); }, 2700));
    H.seqTimeouts.push(setTimeout(()=>{ gs.countdownN=2; broadcastState(); }, 3700));
    H.seqTimeouts.push(setTimeout(()=>{ gs.countdownN=1; broadcastState(); }, 4700));
    H.seqTimeouts.push(setTimeout(()=>{ gs.countdownN='go'; broadcastState(); }, 5700));
    H.seqTimeouts.push(setTimeout(()=>{
      gs.phase='active'; gs.countdownN=null;
      gs.timer.duration=gs.settings.roundSeconds; gs.timer.running=true; gs.timer.endAt=Date.now()+gs.settings.roundSeconds*1000;
      broadcastState();
    }, 6300));
  }
  function hostRerollQuestion(idx){
    const p = gs.pairs[idx]; if(!p) return;
    const q = hostPickQuestion(); p.cat=q.cat; p.text=q.text;

  function hostToggleTimer(){
    if(gs.timer.running){
      gs.timer.duration = Math.max(0, Math.round((gs.timer.endAt-Date.now())/1000));
      gs.timer.running=false; gs.timer.endAt=null;
    } else {
      gs.timer.running=true; gs.timer.endAt = Date.now()+gs.timer.duration*1000;
    }
    broadcastState();
  }
  function hostResetRound(){
    gs.timer.duration=gs.settings.roundSeconds; gs.timer.running=false; gs.timer.endAt=null;
    broadcastState();

  /* ---------- Peer: Raum beitreten ---------- */
  function peerBegin(code, name, avatar){
    UI.draftName=name; UI.draftAvatar=avatar; UI.joinCodeInput=code;
    myName=name; myAvatar=avatar;
    if(typeof Peer==='undefined'){
      UI.error='Die Verbindungsbibliothek konnte nicht geladen werden. Prüfe deine Internetverbindung und lade die Seite neu.';
      UI.view='error'; render(); return;
    }
    role='peer'; UI.view='connecting'; UI.error=null; render();
    if(peer){ try{ peer.destroy(); }catch(e){} }
    try{
      peer = new Peer(undefined, { debug:0 });
    }catch(e){ UI.error='Verbindung fehlgeschlagen.'; UI.view='error'; render(); return; }
    peer.on('open', ()=>{
      hostConn = peer.connect('rundenabend-'+code, { reliable:true, serialization:'json' });
      hostConn.on('open', ()=>{ hostConn.send({ type:'join', id:myId, name:myName, avatar:myAvatar }); });
      hostConn.on('data', (msg)=>{
        if(msg && msg.type==='state'){ gs = msg.gs; render(); }
        else if(msg && msg.type==='closed'){ gs=null; UI.error='Der/die Gastgeber:in hat den Raum geschlossen.'; UI.view='error'; render(); }
      });
      hostConn.on('close', ()=>{ if(UI.view!=='error'){ gs=null; UI.error='Verbindung zum Raum verloren.'; UI.view='error'; render(); } });
      hostConn.on('error', ()=>{ gs=null; UI.error='Verbindung zum Raum verloren.'; UI.view='error'; render(); });
    });
    peer.on('error', (err)=>{
      const t = err && err.type;
      UI.error = t==='peer-unavailable' ? 'Diesen Raumcode gibt es nicht (mehr). Prüfe den Code.' : 'Verbindungsfehler ('+(t||'unbekannt')+'). Versuch es erneut.';
      UI.view='error'; role=null; render();
    });
  }
  function peerLeave(){ teardownConnection(); UI.view='home'; UI.error=null; render(); }

  function retryConnect(){
    UI.error=null;
    if(role==='host' || UI.mode==='host') hostBegin(UI.draftName||'Gastgeber:in', UI.draftAvatar);
    else peerBegin(UI.joinCodeInput, UI.draftName||'Mitspieler:in', UI.draftAvatar);
  }

  /* ---------- Sounds je Phasenwechsel ---------- */
  function maybePlaySfxForPhase(){
    if(!gs) return;
    if(gs.phase!==sfx.phase){
      if(gs.phase==='reveal1'){ gs.players.forEach((p,i)=>setTimeout(()=>SFX.pop(i), i*80)); }
      if(gs.phase==='reveal2'){ SFX.clink(); }
      if(gs.phase==='active' && gs.byeId){ setTimeout(()=>SFX.king(), 200); }
      sfx.phase = gs.phase;
    }
    if(gs.countdownN!==sfx.countdownN){
      if(gs.countdownN===3||gs.countdownN===2||gs.countdownN===1) SFX.tick(gs.countdownN);
      if(gs.countdownN==='go') SFX.go();
      sfx.countdownN = gs.countdownN;
    }
  }
  setInterval(()=>{
    if(gs && gs.phase==='active'){
      renderTimerOnly();
      const key = gs.round+':'+gs.timer.endAt+':'+gs.timer.duration;
      if(key!==sfx.timerKey){ sfx.timerKey=key; sfx.timerDone=false; }
      if(!sfx.timerDone && gs.timer.running && timerRemainingSeconds()<=0){ SFX.timeUp(); sfx.timerDone=true; }
    }
  }, 300);
  function timerRemainingSeconds(){
    if(!gs || !gs.timer) return 0;
    if(gs.timer.running && gs.timer.endAt) return Math.max(0, Math.round((gs.timer.endAt - Date.now())/1000));
    return Math.max(0, Math.round(gs.timer.duration));
  }
  function formatTime(sec){ sec=Math.max(0,Math.round(sec)); const m=Math.floor(sec/60), s=sec%60; return m+':'+String(s).padStart(2,'0'); }

  /* ---------- Eingabe-Handling ---------- */
  function handleClick(e){
    const btn = e.target.closest('[data-action]');
    if(!btn) return;
    const action = btn.dataset.action;
    SFX.unlock();
    switch(action){
      case 'go-home': teardownConnection(); UI.view='home'; UI.mode=null; UI.error=null; render(); break;
      case 'go-host-setup': UI.mode='host'; UI.view='host-setup'; UI.error=null; render(); break;
      case 'go-join-setup': UI.mode='join'; UI.view='join-setup'; UI.error=null; render(); break;
      case 'char-random': UI.draftAvatar = randomAvatar(); updateAvatarPreview(); break;
      case 'char-swatch': UI.draftAvatar[btn.dataset.trait] = btn.dataset.color; updateAvatarPreview(); break;
      case 'host-submit-setup': submitHostSetup(); break;
      case 'join-submit-setup': submitJoinSetup(); break;
      case 'copy-room-link': copyRoomLink(); break;
      case 'host-start-game': gs.settings = Object.assign({}, UI.roomSettings); hostStartGame(); break;
      case 'set-round-seconds': UI.roomSettings.roundSeconds = Number(btn.dataset.seconds); render(); break;
      case 'host-reroll': hostRerollQuestion(Number(btn.dataset.idx)); break;
      case 'host-toggle-timer': hostToggleTimer(); break;
      case 'host-reset-round': hostResetRound(); break;
      case 'host-next-round': hostNextRound(); break;
      case 'host-restart-group': hostStartGame(); break;
      case 'host-close-room': hostTeardown(); break;
      case 'peer-leave': peerLeave(); break;
      case 'retry-connect': retryConnect(); break;
    }
  }
  function handleInput(e){
    const t = e.target;
    if(t.id==='draft-name-input'){
      UI.draftName = t.value;
      const prev = document.getElementById('avatar-name-preview');
      if(prev) prev.textContent = t.value || 'Dein Name';
      return;
    }
    if(t.id==='join-code-input'){ UI.joinCodeInput = t.value.toUpperCase(); return; }
    if(t.dataset && t.dataset.action==='char-slider'){ UI.draftAvatar[t.dataset.trait] = Number(t.value); updateAvatarPreview(); return; }
    if(t.dataset && t.dataset.action==='round-mode-radio'){ UI.roomSettings.mode = t.value; render(); return; }
    if(t.dataset && t.dataset.action==='round-count-input'){ UI.roomSettings.roundsCount = Math.max(1, Number(t.value)||1); return; }
    if(t.dataset && t.dataset.action==='round-seconds-input'){ UI.roomSettings.roundSeconds = Math.max(15, Number(t.value)||15); return; }
  }
  app.addEventListener('click', handleClick);
  app.addEventListener('input', handleInput);

  /* ---------- Start ---------- */
  (function boot(){
    const m = /[#&]join=([A-Za-z0-9]{5})/.exec(location.hash);
    if(m){ UI.mode='join'; UI.view='join-setup'; UI.joinCodeInput = m[1].toUpperCase(); }
    render();
  })();

})();
</script>
</body>
</html>
